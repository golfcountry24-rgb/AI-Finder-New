# AI Finder — nginx site config (used on the Semalt workspace).
# Clean URLs: /new → new.html, /about → about.html, /site/<domain> → site.php; unknown paths get 404.html
# with a real 404 status (the SPA shows its "not found" page, robots: noindex).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # one URL per page: /new/ → /new, /new.html → /new, /index.html → /
    # ($request_uri is the original request, so internal file lookups are untouched)
    rewrite ^/(.+)/$ /$1 permanent;
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$1;
    }
    if ($request_uri ~ ^/([^?]+)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    # /site/<domain>: rendered by site.php (site title, description and profile in the HTML)
    location ~ ^/site/([^/]+)$ {
        rewrite ^/site/([^/]+)$ /site.php?d=$1 last;
    }

    error_page 404 /404.html;

    # hashed build files never change: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # same-origin PHP proxies (FreeSerp data, favicons)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
}
