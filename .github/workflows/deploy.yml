name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, typecheck, unit tests, build
        run: npm run check
        env:
          # Pages serves the repo at https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io
          # Pages has no PHP, so the browser talks to the proxy on the demo server
          VITE_API_BASE: https://ws-58.ws.semalt.dev/api/freeserp.php

      - name: Drop PHP files (Pages can't run them)
        run: rm -rf dist/api dist/site.php

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
